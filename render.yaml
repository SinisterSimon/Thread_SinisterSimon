services:
  - type: web
    name: thread
    runtime: python
    plan: free
    region: frankfurt  # same region as the Neon database
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_MODE
        value: offline
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKER_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.7

  # Background worker for experiments. Render workers are paid only (Starter,
  # ~$7/month). Uncomment when you upgrade, then set WORKER_ENABLED=1 above.
