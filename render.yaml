services:
  - type: web
    name: thread
    runtime: python
    plan: free
    region: frankfurt  # same region as the Neon database
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_MODE
        value: offline
      # Shadow drafts on the Live store can use real models while the lab stays offline.
      # Set "live" (or "anthropic") with the API keys in the Render dashboard; capped per day
      # in app/main.py. sync: false, so a Blueprint sync never resets the dashboard value
      # (a fixed value here overwrote it once). Unset means offline (falls back to LLM_MODE).
      - key: DRAFT_LLM_MODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SHOPIFY_STORE_FACTS
        sync: false
      - key: AUTO_DRAFT_AGENT
        sync: false
      - key: WORKER_ENABLED
        value: "0"
      - key: JUDGE_MODEL
        value: claude-sonnet-5-5
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      # v2: a Shopify development store, read-only (shadow mode). Leave empty to hide it.
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7

  # Background worker for experiments. Render workers are paid only (Starter,
  # ~$7/month). Uncomment when you upgrade, then set WORKER_ENABLED=1 above.
