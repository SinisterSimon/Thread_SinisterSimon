<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} · {% block title %}{% endblock %}</title>
  <style>
    :root { --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e2dc; --bg:#faf9f6; --accent:#3c3489; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.6 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:20px 32px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    header h1 { font-size:20px; font-weight:600; margin:0; }
    main { max-width:1000px; margin:0 auto; padding:32px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
    .label { font-size:13px; color:var(--muted); }
    .value { font-size:28px; font-weight:600; margin-top:4px; }
    .note { font-size:13px; color:var(--muted); margin-top:4px; }
    h2 { font-size:16px; font-weight:600; margin:32px 0 12px; }
    .callout { background:#eeedfe; border:1px solid #cecbf6; color:#26215c; border-radius:12px; padding:16px 20px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
    .empty { text-align:center; padding:80px 0; color:var(--muted); }
    nav a { color:var(--muted); text-decoration:none; margin-left:18px; font-size:14px; }
    nav a:hover { color:var(--ink); }
    table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:14px; }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); }
    th { font-weight:600; color:var(--muted); font-size:13px; }
    td a { color:var(--accent); }
    select, input { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:8px; }
    .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:#eeedfe; color:#26215c; }
    .msg { max-width:70%; padding:10px 14px; border-radius:14px; margin:8px 0; }
    .agent { background:#eeedfe; color:#26215c; }
    .shopper { background:#fff; border:1px solid var(--line); margin-left:auto; }
  </style>
</head>
<body>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">{{ app_name }}</a></h1>
  <nav><a href="/">Store</a><a href="/experiments">Experiments</a></nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
